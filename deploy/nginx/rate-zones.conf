# Include once in the nginx http context.
map $request_method $nightvault_write_ip {
    default "";
    POST $binary_remote_addr;
}

map $request_method $nightvault_write_server {
    default "";
    POST $server_name;
}

limit_req_zone $nightvault_write_ip zone=nv_demo_guest_ip:1m rate=12r/m;
limit_req_zone $nightvault_write_server zone=nv_demo_guest_global:1m rate=90r/m;
limit_req_zone $nightvault_write_ip zone=nv_demo_analysis_ip:1m rate=6r/m;
limit_req_zone $nightvault_write_server zone=nv_demo_analysis_global:1m rate=24r/m;
