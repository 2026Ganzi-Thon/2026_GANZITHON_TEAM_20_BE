# Event profile for 200 guest arrivals and smaller analysis batches.
location ~ ^/api/v1/guest-sessions/?$ {
    include /etc/nginx/nightvault/api-proxy.conf;
    limit_req zone=nv_demo_guest_ip burst=220 nodelay;
    limit_req zone=nv_demo_guest_global burst=250 nodelay;
}

location ~ ^/api/v1/worry-requests(?:/[^/]+/retry)?/?$ {
    include /etc/nginx/nightvault/api-proxy.conf;
    limit_req zone=nv_demo_analysis_ip burst=24 nodelay;
    limit_req zone=nv_demo_analysis_global burst=36 nodelay;
}
