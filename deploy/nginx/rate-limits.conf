# Include one rate-limits profile in the HTTPS server block.
location ~ ^/api/v1/guest-sessions/?$ {
    include /etc/nginx/nightvault/api-proxy.conf;
    limit_req zone=nv_demo_guest_ip burst=6 nodelay;
    limit_req zone=nv_demo_guest_global burst=20 nodelay;
}

location ~ ^/api/v1/worry-requests(?:/[^/]+/retry)?/?$ {
    include /etc/nginx/nightvault/api-proxy.conf;
    limit_req zone=nv_demo_analysis_ip burst=5 nodelay;
    limit_req zone=nv_demo_analysis_global burst=12 nodelay;
}
