name: nightvault

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nightvault}
      POSTGRES_USER: ${POSTGRES_USER:-nightvault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nightvault-local-dev}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  db-data:
