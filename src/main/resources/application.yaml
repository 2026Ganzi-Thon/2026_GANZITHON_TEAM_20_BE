spring:
  application:
    name: nightvault
  config:
    import: "optional:file:./.env[.properties]"
  profiles:
    active: "${SPRING_PROFILES_ACTIVE:}"
  task:
    scheduling:
      pool:
        size: 3
server:
  servlet:
    session:
      cookie:
        http-only: true
        secure: true
        same-site: lax
