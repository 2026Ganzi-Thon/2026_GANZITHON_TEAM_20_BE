spring:
  application:
    name: nightvault
  config:
    import: "optional:file:./.env[.properties]"
  profiles:
    active: "${SPRING_PROFILES_ACTIVE:}"
  flyway:
    # Existing BE1 and BE2 databases applied different timestamped versions before integration.
    out-of-order: true
    group: true
  task:
    scheduling:
      pool:
        size: 3
server:
  servlet:
    session:
      cookie:
        http-only: true
        secure: true
        same-site: lax
