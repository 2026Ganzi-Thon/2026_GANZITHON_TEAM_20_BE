server:
  address: "${NIGHTVAULT_BIND_ADDRESS:0.0.0.0}"
  servlet:
    session:
      cookie:
        secure: true

spring:
  datasource:
    url: "${NIGHTVAULT_DB_URL}"
    username: "${NIGHTVAULT_DB_USER}"
    password: "${NIGHTVAULT_DB_PASSWORD}"

nightvault:
  analysis:
    default-timeout-seconds: 12
