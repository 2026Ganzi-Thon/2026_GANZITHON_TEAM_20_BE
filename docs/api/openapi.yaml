openapi: 3.1.0
info:
  title: NightVault 공개 API
  version: 0.1.0
  description: |-
    공동 검토용 1차 초안. 게스트 인증부터 걱정 접수·봉인·공개와 개별 삭제 경계를 다룬다. 프런트엔드는 같은 출처의 Spring API를 호출한다는 가정이다.
    인증·걱정·상태 응답에는 Cache-Control: no-store를 적용한다. 시간은 RFC 3339 형식이며 서버가 UTC로 반환한다. 15초 지연과 30초 후 화면 이동은 UI 정책이며 API 실패 상태와 독립적이다.
    아이디는 소유권 검사를 대체하지 않는다. 다른 게스트의 대상, 삭제·만료된 대상을 조회하면 404를 반환한다. 공통 오류에는 원문·메모·토큰·AI 응답을 포함하지 않는다. 활동·회고·알림·전체 삭제의 세부 API는 공동 합의 후 확장한다.
servers:
- url: /api/v1
tags:
- name: Guest
- name: Analysis
- name: Vault
security:
- guestCookie: []
paths:
  /csrf:
    get:
      tags: [Guest]
      operationId: getCsrfToken
      summary: 쓰기 요청에 필요한 CSRF 토큰 조회
      description: 첫 게스트 생성 전에도 호출한다. 브라우저는 응답에서 설정된 JSESSIONID 쿠키를 유지하고, 쓰기 요청에 응답 JSON의 token 값을 X-CSRF-TOKEN 헤더로 전송한다. 게스트 인증 생성·교체 뒤에는 토큰을 다시 조회한다.
      security: []
      responses:
        '200':
          description: CSRF 토큰
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
        '503':
          $ref: '#/components/responses/Unavailable'
  /guest-sessions:
    post:
      tags: [Guest]
      operationId: startGuestSession
      summary: 게스트 금고 시작 또는 다시 시작
      description: START는 쿠키가 없으면 발급하고, 유효하면 기존 세션을 갱신한다. 무효 쿠키의 START는 401이다. RESTART는 무효 쿠키를 새 게스트로 교체한다. 쿠키가 없으면 신규 발급하고,
        유효하면 재사용한다. 이전 금고 데이터는 기존 만료 정책을 따른다.
      security:
      - csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [mode]
              properties:
                mode:
                  type: string
                  enum: [START, RESTART]
            example:
              mode: START
      responses:
        '200':
          description: 유효한 게스트 세션
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestSession'
              examples:
                active:
                  value:
                    authenticated: true
                    expiresAt: '2026-12-11T14:00:00Z'
          headers:
            Set-Cookie:
              description: 발급 또는 갱신된 운영 HTTPS 쿠키. JavaScript에 인증 값을 노출하지 않는다.
              schema:
                type: string
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfRejected'
        '503':
          $ref: '#/components/responses/Unavailable'
  /guest-sessions/current:
    get:
      tags: [Guest]
      operationId: getGuestSession
      summary: 현재 게스트 인증 상태 확인
      description: 유효한 접속으로 인정되면 세션 만료를 갱신한다. 미발급·쿠키 삭제와 전달된 무효 쿠키를 오류 코드로 구분한다.
      responses:
        '200':
          description: 유효한 게스트 세션
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestSession'
              examples:
                active:
                  value:
                    authenticated: true
                    expiresAt: '2026-12-11T14:00:00Z'
          headers:
            Set-Cookie:
              description: 발급 또는 갱신된 운영 HTTPS 쿠키. JavaScript에 인증 값을 노출하지 않는다.
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          $ref: '#/components/responses/Unavailable'
  /worry-publication/default:
    get:
      tags: [Vault]
      operationId: getDefaultPublication
      summary: 다음 기본 공개 일시 조회
      description: 현재보다 엄격히 미래인 첫 현지 기본 시각을 계산한다. 최초 기본값은 현지 08:00이다. 겹치는 시각은 아직 미래인 첫 오프셋을 사용하며, 건너뛴 시각은 그 구간 뒤 첫 유효 시각을
        사용한다.
      parameters:
      - name: timeZone
        in: query
        required: true
        description: IANA 시간대 식별자. 예시 Asia/Seoul.
        schema:
          type: string
          maxLength: 100
      responses:
        '200':
          description: 제안 공개 시각
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultPublication'
              examples:
                seoul:
                  value:
                    publishAt: '2026-11-11T23:00:00Z'
                    timeZone: Asia/Seoul
                    localTime: 08:00
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          $ref: '#/components/responses/Unavailable'
  /vault/summary:
    get:
      tags: [Vault]
      operationId: getVaultSummary
      summary: 홈의 금고 개수와 분석 상태 조회
      description: 걱정의 내용 없이 조회 가능한 잠금·공개 개수와 가장 가까운 잠금 해제 시각을 반환한다. 접수·진행 중인 분석 요청과 최초 접수 후 24시간 이내의 최종 실패를 카드 후보로 반환한다.
        위기 안내 결과는 홈의 복원용 목록에서 제외한다.
      responses:
        '200':
          description: 홈 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VaultSummary'
              examples:
                example:
                  value:
                    lockedCount: 1
                    publicCount: 0
                    nearestPublishAt: '2026-11-11T23:00:00Z'
                    analysisRequests:
                    - requestId: a468359e-5c99-4c60-8cdd-1c5f167a02a3
                      acceptedAt: '2026-11-11T14:00:00Z'
                      status: PENDING
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          $ref: '#/components/responses/Unavailable'
  /worry-requests:
    post:
      tags: [Analysis]
      operationId: submitWorry
      summary: 걱정 분석 접수
      description: 걱정 및 작업 상태를 커밋한 뒤 202와 요청 ID를 반환한다. 같은 게스트와 제출 키로 재전송하면 현재 상태를 200으로 반환한다. 아직 비교용 지문이 있고 내용이 다르면 409다.
        같은 키는 작업을 다시 생성하지 않는다. 사용자가 작성 화면에서 제출을 누를 때만 호출한다. 기존 제출의 재전송 여부는 새 공개 시각 검증 전에 확인한다. 위기 안내는 최초 활성 앱 문맥이 맞을 때만
        반환한다.
      security:
      - guestCookie: []
        csrfToken: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/AnalysisContextRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorryInput'
            example:
              text: 내일 발표 때 첫 문장을 잊어버릴까 걱정돼.
              anxiety: 3
              memo: 발표 첫 문장 확인
              publishAt: '2026-11-11T23:00:00Z'
      responses:
        '200':
          description: 기존 제출의 현재 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisStatus'
              examples:
                pending:
                  value:
                    requestId: a468359e-5c99-4c60-8cdd-1c5f167a02a3
                    acceptedAt: '2026-11-11T14:00:00Z'
                    status: PENDING
                success:
                  value:
                    requestId: a468359e-5c99-4c60-8cdd-1c5f167a02a3
                    acceptedAt: '2026-11-11T14:00:00Z'
                    status: SUCCEEDED
                    worryId: 1c25f56a-0b86-41d3-8f8c-2f7c19e7d842
                    sealedAt: '2026-11-11T14:00:08Z'
                    publishAt: '2026-11-11T23:00:00Z'
                failed:
                  value:
                    requestId: a468359e-5c99-4c60-8cdd-1c5f167a02a3
                    acceptedAt: '2026-11-11T14:00:00Z'
                    status: FAILED
                    failureCode: ANALYSIS_FAILED
                supportGuidance:
                  value:
                    requestId: a468359e-5c99-4c60-8cdd-1c5f167a02a3
                    acceptedAt: '2026-11-11T14:00:00Z'
                    status: SUPPORT_GUIDANCE
                    guidanceCode: S16
        '202':
          description: 새 작업 접수
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pending'
              examples:
                pending:
                  value:
                    requestId: a468359e-5c99-4c60-8cdd-1c5f167a02a3
                    acceptedAt: '2026-11-11T14:00:00Z'
                    status: PENDING
          headers:
            Location:
              description: 공개 API의 요청 상태 조회 URI
              schema:
                type: string
                format: uri-reference
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfRejected'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 같은 제출 키에 다른 입력
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                IDEMPOTENCY_CONFLICT:
                  value:
                    code: IDEMPOTENCY_CONFLICT
                    message: 동일 키가 다른 제출에 사용됐어요.
        '422':
          $ref: '#/components/responses/InvalidPublication'
        '503':
          $ref: '#/components/responses/Unavailable'
  /worry-requests/{requestId}:
    parameters:
    - $ref: '#/components/parameters/RequestId'
    get:
      tags: [Analysis]
      operationId: getWorryRequest
      summary: 접수된 분석 요청 상태 확인
      description: 저장 성공 후 걱정 ID를 반환한다. 분석 원문과 AI 콘텐츠는 이 응답에서 제외한다. 위기 안내에는 같은 활성 앱 문맥의 X-Analysis-Context가 필요하다. 문맥이 유실됐거나
        만료됐으면 404를 반환한다. 성공 응답의 publishAt은 현재 걱정의 공개 시각이다.
      parameters:
      - $ref: '#/components/parameters/AnalysisContext'
      responses:
        '200':
          description: 분석 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisStatus'
              examples:
                pending:
                  value:
                    requestId: a468359e-5c99-4c60-8cdd-1c5f167a02a3
                    acceptedAt: '2026-11-11T14:00:00Z'
                    status: PENDING
                success:
                  value:
                    requestId: a468359e-5c99-4c60-8cdd-1c5f167a02a3
                    acceptedAt: '2026-11-11T14:00:00Z'
                    status: SUCCEEDED
                    worryId: 1c25f56a-0b86-41d3-8f8c-2f7c19e7d842
                    sealedAt: '2026-11-11T14:00:08Z'
                    publishAt: '2026-11-11T23:00:00Z'
                failed:
                  value:
                    requestId: a468359e-5c99-4c60-8cdd-1c5f167a02a3
                    acceptedAt: '2026-11-11T14:00:00Z'
                    status: FAILED
                    failureCode: ANALYSIS_FAILED
                supportGuidance:
                  value:
                    requestId: a468359e-5c99-4c60-8cdd-1c5f167a02a3
                    acceptedAt: '2026-11-11T14:00:00Z'
                    status: SUPPORT_GUIDANCE
                    guidanceCode: S16
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
        '400':
          $ref: '#/components/responses/InvalidInput'
  /worry-requests/{requestId}/retry:
    parameters:
    - $ref: '#/components/parameters/RequestId'
    post:
      tags: [Analysis]
      operationId: retryWorryRequest
      summary: 최종 실패한 걱정 재시도
      description: 최종 실패가 표시되는 동안에만 새 사용자 재시도를 접수한다. 브라우저에 남은 입력 또는 사용자가 다시 입력한 값을 요청에 넣고, publishAt이 지나면 다시 선택한다. 접수 ID와
        최초 보관 기한은 유지한다. 같은 재시도 키의 응답 유실에는 현재 상태를 반환한다. 새 재시도는 활성 앱 문맥을 교체한다. 기존 재시도 키는 새 공개 시각 검증 전에 확인한다. 위기 안내는 저장된 활성
        앱 문맥이 맞을 때만 반환한다.
      security:
      - guestCookie: []
        csrfToken: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/AnalysisContextRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorryInput'
            example:
              text: 내일 발표 때 첫 문장을 잊어버릴까 걱정돼.
              anxiety: 3
              memo: 발표 첫 문장 확인
              publishAt: '2026-11-11T23:00:00Z'
      responses:
        '200':
          description: 이미 접수된 재시도의 현재 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisStatus'
              examples:
                pending:
                  value:
                    requestId: a468359e-5c99-4c60-8cdd-1c5f167a02a3
                    acceptedAt: '2026-11-11T14:00:00Z'
                    status: PENDING
                success:
                  value:
                    requestId: a468359e-5c99-4c60-8cdd-1c5f167a02a3
                    acceptedAt: '2026-11-11T14:00:00Z'
                    status: SUCCEEDED
                    worryId: 1c25f56a-0b86-41d3-8f8c-2f7c19e7d842
                    sealedAt: '2026-11-11T14:00:08Z'
                    publishAt: '2026-11-11T23:00:00Z'
                failed:
                  value:
                    requestId: a468359e-5c99-4c60-8cdd-1c5f167a02a3
                    acceptedAt: '2026-11-11T14:00:00Z'
                    status: FAILED
                    failureCode: ANALYSIS_FAILED
                supportGuidance:
                  value:
                    requestId: a468359e-5c99-4c60-8cdd-1c5f167a02a3
                    acceptedAt: '2026-11-11T14:00:00Z'
                    status: SUPPORT_GUIDANCE
                    guidanceCode: S16
        '202':
          description: 재시도 접수
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pending'
              examples:
                pending:
                  value:
                    requestId: a468359e-5c99-4c60-8cdd-1c5f167a02a3
                    acceptedAt: '2026-11-11T14:00:00Z'
                    status: PENDING
          headers:
            Location:
              description: 공개 API의 요청 상태 조회 URI
              schema:
                type: string
                format: uri-reference
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfRejected'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 새 재시도를 접수할 수 없는 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                RETRY_NOT_ALLOWED:
                  value:
                    code: RETRY_NOT_ALLOWED
                    message: 재시도할 수 있는 상태가 아니에요.
                IDEMPOTENCY_CONFLICT:
                  value:
                    code: IDEMPOTENCY_CONFLICT
                    message: 동일 키가 다른 재시도에 사용됐어요.
        '422':
          $ref: '#/components/responses/InvalidPublication'
        '503':
          $ref: '#/components/responses/Unavailable'
  /worries:
    get:
      tags: [Vault]
      operationId: listWorries
      summary: 잠긴 걱정 또는 공개된 걱정 목록 조회
      description: 잠금과 공개 영역을 따로 조회한다. 작성 최신순이며 같은 작성 시각은 걱정 ID로 정렬한다. cursor는 동일 조회 조건에서만 사용한다. 공개 목록의 요약 노출은 상세 열람을 기록하지
        않는다.
      parameters:
      - name: visibility
        in: query
        required: true
        description: 조회할 영역
        schema:
          type: string
          enum: [LOCKED, PUBLIC]
      - name: cursor
        in: query
        required: false
        description: 앞 응답의 nextCursor
        schema:
          type: string
          minLength: 1
      - name: limit
        in: query
        required: false
        description: 페이지 크기
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: 영역별 걱정 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorryList'
              examples:
                locked:
                  value:
                    visibility: LOCKED
                    items:
                    - worryId: 1c25f56a-0b86-41d3-8f8c-2f7c19e7d842
                      visibility: LOCKED
                      createdAt: '2026-11-11T14:00:00Z'
                      publishAt: '2026-11-11T23:00:00Z'
                    nextCursor: null
                public:
                  value:
                    visibility: PUBLIC
                    items:
                    - worryId: 1c25f56a-0b86-41d3-8f8c-2f7c19e7d842
                      visibility: PUBLIC
                      createdAt: '2026-11-11T14:00:00Z'
                      publishAt: '2026-11-11T23:00:00Z'
                      summary: 내일 발표를 앞두고 내용을 잊을까 걱정하고 있다.
                      anxietyBefore: 3
                      firstViewedAt: null
                    nextCursor: null
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          $ref: '#/components/responses/Unavailable'
  /worries/{worryId}:
    parameters:
    - $ref: '#/components/parameters/WorryId'
    get:
      tags: [Vault]
      operationId: getWorry
      summary: 잠금 안내 또는 공개 상세 조회
      description: 잠긴 응답은 잠금 안내에 필요한 메타데이터만 사용한다. 실제 상세 화면을 열었을 때는 별도의 열람 요청을 호출한다.
      responses:
        '200':
          description: 현재 공개 상태에 맞는 상세
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorryDetail'
              examples:
                locked:
                  value:
                    worryId: 1c25f56a-0b86-41d3-8f8c-2f7c19e7d842
                    visibility: LOCKED
                    createdAt: '2026-11-11T14:00:00Z'
                    publishAt: '2026-11-11T23:00:00Z'
                public:
                  value:
                    worryId: 1c25f56a-0b86-41d3-8f8c-2f7c19e7d842
                    visibility: PUBLIC
                    createdAt: '2026-11-11T14:00:00Z'
                    publishAt: '2026-11-11T23:00:00Z'
                    summary: 내일 발표를 앞두고 내용을 잊을까 걱정하고 있다.
                    anxietyBefore: 3
                    firstViewedAt: null
                    text: 내일 발표 때 첫 문장을 잊어버릴까 걱정돼.
                    memo: 발표 첫 문장 확인
                    anxietyAfter: null
                    analysis:
                      summary: 내일 발표를 앞두고 내용을 잊을까 걱정하고 있다.
                      recommendation:
                        type: ACTION
                        reason: 발표의 시작 부분을 짧게 연습하면 준비할 행동을 한 가지 정할 수 있어요.
                      actionSteps: [발표 자료의 첫 장을 열어요., 첫 문장을 소리 내어 한 번 읽어요., 막힌 단어 하나를 메모해요.]
                      restGuide: 발을 바닥에 대고 어깨를 편하게 두어요.
                      empathyMessage: 발표를 앞두면 준비한 내용을 잊을까 걱정될 수 있어요.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
        '400':
          $ref: '#/components/responses/InvalidInput'
    delete:
      tags: [Vault]
      operationId: deleteWorry
      summary: 걱정 개별 삭제 시작 또는 완료 확인
      description: BE2의 공통 삭제 처리를 호출한다. 삭제 시작과 동시에 조회를 차단한다. 처리 중 같은 DELETE는 202를 반환하고 필수 삭제가 모두 끝나면 204를 반환한다. 인증된 소유자는
        삭제 이력 보관 기간 동안 완료 응답을 재조회할 수 있다. 202를 받은 클라이언트는 같은 DELETE로 완료를 확인한다.
      security:
      - guestCookie: []
        csrfToken: []
      responses:
        '202':
          description: 삭제 처리 중
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status:
                    type: string
                    const: DELETING
              examples:
                pending:
                  value:
                    status: DELETING
        '204':
          description: 삭제 완료
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfRejected'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
        '400':
          $ref: '#/components/responses/InvalidInput'
  /worries/{worryId}/publication:
    parameters:
    - $ref: '#/components/parameters/WorryId'
    patch:
      tags: [Vault]
      operationId: updatePublication
      summary: 잠긴 걱정의 공개 일시 변경
      description: 변경 커밋 전 기존 공개 시각과 만료를 검사한다. 이미 공개됐으면 409를 반환해 클라이언트가 상태를 다시 조회하게 한다. 성공 시 관련 공개 알림 예약도 갱신한다.
      security:
      - guestCookie: []
        csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [publishAt]
              properties:
                publishAt:
                  type: string
                  format: date-time
            example:
              publishAt: '2026-11-12T00:00:00Z'
      responses:
        '200':
          description: 갱신된 잠금 안내
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LockedWorry'
              examples:
                updated:
                  value:
                    worryId: 1c25f56a-0b86-41d3-8f8c-2f7c19e7d842
                    visibility: LOCKED
                    createdAt: '2026-11-11T14:00:00Z'
                    publishAt: '2026-11-12T00:00:00Z'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfRejected'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 이미 공개된 걱정
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                ALREADY_PUBLIC:
                  value:
                    code: ALREADY_PUBLIC
                    message: 이미 공개된 걱정이에요.
        '422':
          $ref: '#/components/responses/InvalidPublication'
        '503':
          $ref: '#/components/responses/Unavailable'
  /worries/{worryId}/view:
    parameters:
    - $ref: '#/components/parameters/WorryId'
    post:
      tags: [Vault]
      operationId: markWorryViewed
      summary: 공개된 걱정의 최초 상세 열람 기록
      description: S-08 또는 S-14 상세 화면이 실제로 열렸을 때 호출한다. 최초 서버 시각만 저장하며 반복 요청은 같은 시각을 반환한다. 잠긴 상태에는 기록하지 않는다.
      security:
      - guestCookie: []
        csrfToken: []
      responses:
        '200':
          description: 최초 열람 시각
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [firstViewedAt]
                properties:
                  firstViewedAt:
                    type: string
                    format: date-time
              examples:
                firstView:
                  value:
                    firstViewedAt: '2026-11-11T23:01:00Z'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfRejected'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 아직 잠긴 걱정
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                WORRY_LOCKED:
                  value:
                    code: WORRY_LOCKED
                    message: 아직 공개되지 않았어요.
        '503':
          $ref: '#/components/responses/Unavailable'
        '400':
          $ref: '#/components/responses/InvalidInput'
components:
  securitySchemes:
    guestCookie:
      type: apiKey
      in: cookie
      name: NIGHTVAULT_SESSION
      description: 서버가 발급한 같은 출처의 게스트 인증 쿠키. HttpOnly와 SameSite=Lax를 적용한다. Secure는 기본 프로필에서 사용하고 로컬 HTTP 개발 프로필에서 해제한다.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-TOKEN
      description: GET /csrf에서 받은 값. 인증 쿠키 기반 쓰기 요청에 필요.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 제출 또는 재시도 동작별 UUID. 동일 동작의 재전송에는 동일 값을 보낸다.
      schema:
        type: string
        format: uuid
    AnalysisContextRequired:
      name: X-Analysis-Context
      in: header
      required: true
      description: 제출 또는 재시도의 활성 앱 문맥 UUID. 브라우저 메모리에만 보관한다.
      schema:
        type: string
        format: uuid
    AnalysisContext:
      name: X-Analysis-Context
      in: header
      required: false
      description: 같은 활성 앱에서 제출 또는 재시도할 때 보낸 값. 위기 안내 확인에만 필요.
      schema:
        type: string
        format: uuid
    RequestId:
      name: requestId
      in: path
      required: true
      description: 분석 요청 식별자
      schema:
        type: string
        format: uuid
    WorryId:
      name: worryId
      in: path
      required: true
      description: 저장된 걱정 식별자
      schema:
        type: string
        format: uuid
  responses:
    InvalidInput:
      description: 요청 형식 또는 입력값 오류
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            INVALID_INPUT:
              value:
                code: INVALID_INPUT
                message: 입력값을 확인해 주세요.
    InvalidPublication:
      description: 공개 시각이 현재 이전·현재와 동일하거나 만료 시각 이상
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            INVALID_PUBLICATION:
              value:
                code: INVALID_PUBLICATION
                message: 공개할 날짜와 시간을 다시 선택해 주세요.
    Unauthenticated:
      description: 유효한 게스트 인증 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            GUEST_SESSION_REQUIRED:
              value:
                code: GUEST_SESSION_REQUIRED
                message: 게스트로 시작해 주세요.
            GUEST_SESSION_INVALID:
              value:
                code: GUEST_SESSION_INVALID
                message: 이 브라우저의 이용 정보를 확인할 수 없어요.
    CsrfRejected:
      description: CSRF 검증 실패
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            CSRF_REJECTED:
              value:
                code: CSRF_REJECTED
                message: 요청을 다시 확인해 주세요.
    NotFound:
      description: 소유하지 않았거나 조회 가능한 대상이 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            NOT_FOUND:
              value:
                code: NOT_FOUND
                message: 확인할 수 없는 항목이에요.
    Unavailable:
      description: 현재 요청을 처리할 수 없음. 쓰기 응답이 유실됐을 수 있는 경우 같은 키로 상태를 확인한다.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            TEMPORARILY_UNAVAILABLE:
              value:
                code: TEMPORARILY_UNAVAILABLE
                message: 잠시 후 다시 시도해 주세요.
  schemas:
    ApiError:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]*$
        message:
          type: string
          minLength: 1
    CsrfToken:
      type: object
      additionalProperties: false
      required: [token, headerName]
      properties:
        token:
          type: string
          minLength: 1
        headerName:
          type: string
          const: X-CSRF-TOKEN
    GuestSession:
      type: object
      additionalProperties: false
      required: [authenticated, expiresAt]
      properties:
        authenticated:
          type: boolean
          const: true
        expiresAt:
          type: string
          format: date-time
    DefaultPublication:
      type: object
      additionalProperties: false
      required: [publishAt, timeZone, localTime]
      properties:
        publishAt:
          type: string
          format: date-time
        timeZone:
          type: string
          minLength: 1
        localTime:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
    WorryText:
      type: string
      minLength: 1
      maxLength: 500
      pattern: '[^\u0009-\u000D\u0020\u0085\u00A0\u1680\u2000-\u200A\u2028\u2029\u202F\u205F\u3000]'
      description: 유니코드 White_Space가 아닌 문자가 한 글자 이상이어야 한다. 길이는 공백을 포함한 유니코드 코드 포인트 수로 계산한다.
    Memo:
      type: string
      maxLength: 100
      description: 선택 입력. 공백만 있는 값은 미입력으로 정규화한다.
    Anxiety:
      type: integer
      minimum: 1
      maximum: 5
    WorryInput:
      type: object
      additionalProperties: false
      required: [text, anxiety, publishAt]
      properties:
        text:
          $ref: '#/components/schemas/WorryText'
        anxiety:
          $ref: '#/components/schemas/Anxiety'
        memo:
          $ref: '#/components/schemas/Memo'
        publishAt:
          type: string
          format: date-time
    AnalysisStatus:
      oneOf:
      - $ref: '#/components/schemas/Pending'
      - $ref: '#/components/schemas/Succeeded'
      - $ref: '#/components/schemas/Failed'
      - $ref: '#/components/schemas/SupportGuidance'
      discriminator:
        propertyName: status
        mapping:
          PENDING: '#/components/schemas/Pending'
          SUCCEEDED: '#/components/schemas/Succeeded'
          FAILED: '#/components/schemas/Failed'
          SUPPORT_GUIDANCE: '#/components/schemas/SupportGuidance'
    Pending:
      type: object
      additionalProperties: false
      required: [requestId, acceptedAt, status]
      properties:
        requestId:
          type: string
          format: uuid
        acceptedAt:
          type: string
          format: date-time
        status:
          type: string
          const: PENDING
    Succeeded:
      type: object
      additionalProperties: false
      required: [requestId, acceptedAt, status, worryId, sealedAt, publishAt]
      properties:
        requestId:
          type: string
          format: uuid
        acceptedAt:
          type: string
          format: date-time
        status:
          type: string
          const: SUCCEEDED
        worryId:
          type: string
          format: uuid
        sealedAt:
          type: string
          format: date-time
        publishAt:
          type: string
          format: date-time
    Failed:
      type: object
      additionalProperties: false
      required: [requestId, acceptedAt, status, failureCode]
      properties:
        requestId:
          type: string
          format: uuid
        acceptedAt:
          type: string
          format: date-time
        status:
          type: string
          const: FAILED
        failureCode:
          type: string
          const: ANALYSIS_FAILED
    SupportGuidance:
      type: object
      additionalProperties: false
      required: [requestId, acceptedAt, status, guidanceCode]
      properties:
        requestId:
          type: string
          format: uuid
        acceptedAt:
          type: string
          format: date-time
        status:
          type: string
          const: SUPPORT_GUIDANCE
        guidanceCode:
          type: string
          const: S16
    VaultSummary:
      type: object
      additionalProperties: false
      required: [lockedCount, publicCount, nearestPublishAt, analysisRequests]
      properties:
        lockedCount:
          type: integer
          minimum: 0
        publicCount:
          type: integer
          minimum: 0
        nearestPublishAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        analysisRequests:
          type: array
          items:
            oneOf:
            - $ref: '#/components/schemas/Pending'
            - $ref: '#/components/schemas/Failed'
    HelpType:
      type: string
      enum: [SHRED, ACTION, REST, EMPATHY]
    GeneratedContent:
      type: object
      additionalProperties: false
      required: [summary, recommendation, actionSteps, restGuide, empathyMessage]
      properties:
        summary:
          type: string
          minLength: 1
          maxLength: 500
        recommendation:
          type: object
          additionalProperties: false
          required: [type, reason]
          properties:
            type:
              $ref: '#/components/schemas/HelpType'
            reason:
              type: string
              minLength: 1
              maxLength: 300
        actionSteps:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 200
          minItems: 3
          maxItems: 3
        restGuide:
          type: string
          minLength: 1
          maxLength: 500
        empathyMessage:
          type: string
          minLength: 1
          maxLength: 500
    LockedWorry:
      type: object
      additionalProperties: false
      required: [worryId, visibility, createdAt, publishAt]
      properties:
        worryId:
          type: string
          format: uuid
        visibility:
          type: string
          const: LOCKED
        createdAt:
          type: string
          format: date-time
        publishAt:
          type: string
          format: date-time
    PublicWorryItem:
      type: object
      additionalProperties: false
      required: [worryId, visibility, createdAt, publishAt, summary, anxietyBefore, firstViewedAt]
      properties:
        worryId:
          type: string
          format: uuid
        visibility:
          type: string
          const: PUBLIC
        createdAt:
          type: string
          format: date-time
        publishAt:
          type: string
          format: date-time
        summary:
          type: string
          minLength: 1
        anxietyBefore:
          $ref: '#/components/schemas/Anxiety'
        firstViewedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
    PublicWorry:
      type: object
      additionalProperties: false
      required: [worryId, visibility, createdAt, publishAt, summary, anxietyBefore, firstViewedAt, text, memo, anxietyAfter,
        analysis]
      properties:
        worryId:
          type: string
          format: uuid
        visibility:
          type: string
          const: PUBLIC
        createdAt:
          type: string
          format: date-time
        publishAt:
          type: string
          format: date-time
        summary:
          type: string
          minLength: 1
        anxietyBefore:
          $ref: '#/components/schemas/Anxiety'
        firstViewedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        text:
          $ref: '#/components/schemas/WorryText'
        memo:
          anyOf:
          - $ref: '#/components/schemas/Memo'
          - type: 'null'
        anxietyAfter:
          anyOf:
          - $ref: '#/components/schemas/Anxiety'
          - type: 'null'
        analysis:
          $ref: '#/components/schemas/GeneratedContent'
    WorryDetail:
      oneOf:
      - $ref: '#/components/schemas/LockedWorry'
      - $ref: '#/components/schemas/PublicWorry'
      discriminator:
        propertyName: visibility
        mapping:
          LOCKED: '#/components/schemas/LockedWorry'
          PUBLIC: '#/components/schemas/PublicWorry'
    WorryList:
      oneOf:
      - $ref: '#/components/schemas/LockedList'
      - $ref: '#/components/schemas/PublicList'
      discriminator:
        propertyName: visibility
        mapping:
          LOCKED: '#/components/schemas/LockedList'
          PUBLIC: '#/components/schemas/PublicList'
    LockedList:
      type: object
      additionalProperties: false
      required: [visibility, items, nextCursor]
      properties:
        visibility:
          type: string
          const: LOCKED
        items:
          type: array
          items:
            $ref: '#/components/schemas/LockedWorry'
        nextCursor:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
    PublicList:
      type: object
      additionalProperties: false
      required: [visibility, items, nextCursor]
      properties:
        visibility:
          type: string
          const: PUBLIC
        items:
          type: array
          items:
            $ref: '#/components/schemas/PublicWorryItem'
        nextCursor:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
