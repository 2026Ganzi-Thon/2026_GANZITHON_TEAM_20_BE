      description: BE2의 공통 삭제 처리를 호출한다. 삭제 시작과 동시에 조회를 차단한다. 처리 중 같은 DELETE는 202를 반환하고 필수 삭제가 모두 끝나면 204를 반환한다. 인증된 소유자는
