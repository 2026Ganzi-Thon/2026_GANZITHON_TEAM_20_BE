  /worries/{worryId}/activities:
    parameters:
    - $ref: '#/components/parameters/WorryId'
    post:
      tags: [Activity]
      operationId: startActivity
      summary: 도움 선택·활동 시작·도움 변경
      description: |-
        ACTION은 S-10 진입 시, REST는 "시작하기" 선택 시, EMPATHY는 S-12 진입 시 호출한다. REST "다음에 할게요"는 호출하지 않는다(활동을 만들지 않음).
        SHRED는 받지 않는다. 파쇄는 삭제 확인 후 DELETE /worries/{worryId}만 호출한다.
        같은 유형의 진행 중·일시정지 활동이 있으면 새로 만들지 않고 200으로 반환한다(startedAt 유지). 재전송·동시 요청에도 활동은 하나다.
        중단된 ACTION이 있으면 같은 활동을 재개한다(체크 유지, 200). 중단·완료된 REST·EMPATHY와 완료된 ACTION은 새 활동으로 시작한다(REST는 새 180초).
        다른 유형의 활동이 열려 있으면 409를 반환한다. 사용자가 변경을 확인하면 replaceOpen=true로 다시 호출하며, 서버가 한 트랜잭션에서 기존 활동을 중단하고 시작한다.
      security:
      - guestCookie: []
        csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [helpType]
              properties:
                helpType:
                  $ref: '#/components/schemas/ActivityHelpType'
                replaceOpen:
                  type: boolean
                  default: false
                  description: true면 다른 유형의 열린 활동을 중단하고 시작한다(M-05 도움 변경 확인).
            examples:
              start:
                value:
                  helpType: REST
              replace:
                value:
                  helpType: ACTION
                  replaceOpen: true
      responses:
        '201':
          description: 새 활동 시작
          headers:
            Location:
              description: /api/v1/activities/{activityId}
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
              examples:
                rest:
                  value:
                    activityId: 7a0b8e4c-5d1f-4f0e-9a51-3f0f3c2b9d10
                    worryId: 1c25f56a-0b86-41d3-8f8c-2f7c19e7d842
                    helpType: REST
                    state: IN_PROGRESS
                    startedAt: '2026-11-12T00:15:00Z'
                    endedAt: null
                    version: 0
                    serverTime: '2026-11-12T00:15:00Z'
                    action: null
                    rest:
                      durationSeconds: 180
                      endsAt: '2026-11-12T00:18:00Z'
                      remainingSeconds: 180
                      timeOver: false
                    feedback: null
                    stoppedActivityId: null
                    nextUnviewedExists: null
        '200':
          description: 같은 유형의 열린 활동 반환 또는 중단된 액션 재개. 본문은 201과 같다.
          content:
