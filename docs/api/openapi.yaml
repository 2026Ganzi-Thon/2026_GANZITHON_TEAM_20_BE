                    stoppedActivityId: 7a0b8e4c-5d1f-4f0e-9a51-3f0f3c2b9d10
                    nextUnviewedExists: null
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfRejected'
