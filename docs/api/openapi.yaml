                  value:
                    code: WORRY_LOCKED
                    message: 아직 공개되지 않았어요.
        '503':
          $ref: '#/components/responses/Unavailable'
  /activities/{activityId}/stop:
    parameters:
    - $ref: '#/components/parameters/ActivityId'
    post:
      tags: [Activity]
      operationId: stopActivity
      summary: 활동 중단
      description: 액션 "나중에 이어하기", 휴식 "그만두기"에서 호출한다. 확인창을 여는 것만으로는 호출하지 않는다. 액션 체크는 유지하고 휴식 남은 시간은 버린다. 이미 중단됐으면 200.
      security:
      - guestCookie: []
        csrfToken: []
      responses:
        '200':
          description: 중단된 활동 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfRejected'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 이미 완료된 활동 또는 잠긴 걱정
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                ACTIVITY_ALREADY_ENDED:
                  value:
                    code: ACTIVITY_ALREADY_ENDED
                    message: 이미 끝난 활동이에요.
                WORRY_LOCKED:
                  value:
                    code: WORRY_LOCKED
                    message: 아직 공개되지 않았어요.
        '503':
          $ref: '#/components/responses/Unavailable'
  /activities/{activityId}/complete:
    parameters:
    - $ref: '#/components/parameters/ActivityId'
    post:
      tags: [Activity]
      operationId: completeActivity
      summary: 활동 완료
      description: |-
        사용자의 명시적 완료(액션 전체 완료, 휴식 완료, 공감 "읽었어요"). 서버 성공 응답 후 S-13으로 이동한다.
        ACTION은 세 단계를 모두 체크해야, REST는 진행 중이고 남은 시간이 0이어야 완료된다. 휴식이 0초가 돼도 서버가 자동 완료하지 않는다.
        이미 완료면 200(endedAt 유지). 완료와 중단이 동시에 오면 먼저 커밋한 요청이 이기고 나머지는 409다.
        nextUnviewedExists는 현재 걱정 말고 아직 열어 보지 않은 공개 걱정이 있는지다("다음 걱정 보기" 표시).
      security:
      - guestCookie: []
        csrfToken: []
      responses:
        '200':
          description: 완료된 활동 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
              examples:
                rest:
                  value:
                    activityId: 7a0b8e4c-5d1f-4f0e-9a51-3f0f3c2b9d10
                    worryId: 1c25f56a-0b86-41d3-8f8c-2f7c19e7d842
                    helpType: REST
                    state: COMPLETED
                    startedAt: '2026-11-12T00:15:00Z'
                    endedAt: '2026-11-12T00:19:10Z'
                    version: 3
                    serverTime: '2026-11-12T00:19:10Z'
                    action: null
                    rest:
                      durationSeconds: 180
                      endsAt: null
                      remainingSeconds: null
                      timeOver: false
                    feedback: null
                    stoppedActivityId: null
                    nextUnviewedExists: true
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfRejected'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 완료 조건 미충족, 이미 중단된 활동, 또는 잠긴 걱정
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                ACTION_STEPS_INCOMPLETE:
                  value:
                    code: ACTION_STEPS_INCOMPLETE
                    message: 세 단계를 모두 마치면 완료할 수 있어요.
                REST_NOT_FINISHED:
                  value:
                    code: REST_NOT_FINISHED
                    message: 아직 휴식 시간이 남았어요.
                ACTIVITY_ALREADY_ENDED:
                  value:
                    code: ACTIVITY_ALREADY_ENDED
                    message: 이미 끝난 활동이에요.
                WORRY_LOCKED:
                  value:
                    code: WORRY_LOCKED
                    message: 아직 공개되지 않았어요.
        '503':
          $ref: '#/components/responses/Unavailable'
  /activities/{activityId}/feedback:
    parameters:
    - $ref: '#/components/parameters/ActivityId'
    put:
      tags: [Activity]
      operationId: putActivityFeedback
      summary: 도움 평가 저장
      description: |-
        선택 입력이며 기본값이 없다. 평가하지 않으면 활동의 feedback은 null이다. 완료된 활동(ACTION·REST·EMPATHY)에만 저장한다.
        다른 답을 보내면 덮어쓰고 updatedAt만 바뀐다(answeredAt 유지). 같은 답 재전송은 그대로 200.
        걱정이 삭제 중이거나 만료됐으면 404이며 저장하지 않는다. 평가 실패는 활동 완료 상태에 영향을 주지 않는다.
      security:
      - guestCookie: []
        csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [answer]
              properties:
                answer:
                  $ref: '#/components/schemas/FeedbackAnswer'
            example:
              answer: HELPFUL
      responses:
        '200':
          description: 저장된 평가
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedFeedback'
              examples:
                saved:
                  value:
                    activityId: 7a0b8e4c-5d1f-4f0e-9a51-3f0f3c2b9d10
                    answer: HELPFUL
                    answeredAt: '2026-11-12T00:19:30Z'
                    updatedAt: '2026-11-12T00:19:30Z'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfRejected'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 완료하지 않은 활동(진행 중·일시정지·중단) 또는 잠긴 걱정
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                ACTIVITY_NOT_COMPLETED:
                  value:
                    code: ACTIVITY_NOT_COMPLETED
                    message: 완료한 활동만 평가할 수 있어요.
                WORRY_LOCKED:
                  value:
                    code: WORRY_LOCKED
                    message: 아직 공개되지 않았어요.
        '503':
          $ref: '#/components/responses/Unavailable'
components:
  securitySchemes:
    guestCookie:
      type: apiKey
      in: cookie
      name: NIGHTVAULT_SESSION
      description: 서버가 발급한 같은 출처의 게스트 인증 쿠키. HttpOnly와 SameSite=Lax를 적용한다. Secure는 기본 프로필에서 사용하고 로컬 HTTP 개발 프로필에서 해제한다.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-TOKEN
      description: GET /csrf에서 받은 값. 인증 쿠키 기반 쓰기 요청에 필요.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 제출 또는 재시도 동작별 UUID. 동일 동작의 재전송에는 동일 값을 보낸다.
      schema:
        type: string
        format: uuid
    AnalysisContextRequired:
      name: X-Analysis-Context
      in: header
      required: true
      description: 제출 또는 재시도의 활성 앱 문맥 UUID. 브라우저 메모리에만 보관한다.
      schema:
        type: string
        format: uuid
    AnalysisContext:
      name: X-Analysis-Context
      in: header
      required: false
      description: 같은 활성 앱에서 제출 또는 재시도할 때 보낸 값. 위기 안내 확인에만 필요.
      schema:
        type: string
        format: uuid
    RequestId:
      name: requestId
      in: path
      required: true
      description: 분석 요청 식별자
      schema:
        type: string
        format: uuid
    WorryId:
      name: worryId
      in: path
      required: true
      description: 저장된 걱정 식별자
      schema:
        type: string
        format: uuid
    ActivityId:
      name: activityId
      in: path
      required: true
      description: 활동 식별자
      schema:
        type: string
        format: uuid
    StepNo:
      name: stepNo
      in: path
      required: true
      description: 액션 단계 번호
      schema:
        type: integer
        minimum: 1
        maximum: 3
  responses:
    InvalidInput:
      description: 요청 형식 또는 입력값 오류
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            INVALID_INPUT:
              value:
                code: INVALID_INPUT
                message: 입력값을 확인해 주세요.
    InvalidPublication:
      description: 공개 시각이 현재 이전·현재와 동일하거나 만료 시각 이상
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            INVALID_PUBLICATION:
              value:
                code: INVALID_PUBLICATION
                message: 공개할 날짜와 시간을 다시 선택해 주세요.
    Unauthenticated:
      description: 유효한 게스트 인증 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            GUEST_SESSION_REQUIRED:
              value:
                code: GUEST_SESSION_REQUIRED
                message: 게스트로 시작해 주세요.
            GUEST_SESSION_INVALID:
              value:
                code: GUEST_SESSION_INVALID
                message: 이 브라우저의 이용 정보를 확인할 수 없어요.
    CsrfRejected:
      description: CSRF 검증 실패
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            CSRF_REJECTED:
              value:
                code: CSRF_REJECTED
                message: 요청을 다시 확인해 주세요.
    NotFound:
      description: 소유하지 않았거나 조회 가능한 대상이 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            NOT_FOUND:
              value:
                code: NOT_FOUND
                message: 확인할 수 없는 항목이에요.
    Unavailable:
      description: 현재 요청을 처리할 수 없음. 쓰기 응답이 유실됐을 수 있는 경우 같은 키로 상태를 확인한다.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            TEMPORARILY_UNAVAILABLE:
              value:
                code: TEMPORARILY_UNAVAILABLE
                message: 잠시 후 다시 시도해 주세요.
  schemas:
    ApiError:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]*$
        message:
          type: string
          minLength: 1
    CsrfToken:
      type: object
      additionalProperties: false
      required: [token, headerName]
      properties:
        token:
          type: string
          minLength: 1
        headerName:
          type: string
          const: X-CSRF-TOKEN
    GuestSession:
      type: object
      additionalProperties: false
      required: [authenticated, expiresAt]
      properties:
        authenticated:
          type: boolean
          const: true
        expiresAt:
          type: string
          format: date-time
    DefaultPublication:
      type: object
      additionalProperties: false
      required: [publishAt, timeZone, localTime]
      properties:
        publishAt:
          type: string
          format: date-time
        timeZone:
          type: string
          minLength: 1
        localTime:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
    WorryText:
      type: string
      minLength: 1
      maxLength: 500
      pattern: '[^\u0009-\u000D\u0020\u0085\u00A0\u1680\u2000-\u200A\u2028\u2029\u202F\u205F\u3000]'
      description: 유니코드 White_Space가 아닌 문자가 한 글자 이상이어야 한다. 길이는 공백을 포함한 유니코드 코드 포인트 수로 계산한다.
    Memo:
      type: string
      maxLength: 100
      description: 선택 입력. 공백만 있는 값은 미입력으로 정규화한다.
    Anxiety:
      type: integer
      minimum: 1
      maximum: 5
    WorryInput:
      type: object
      additionalProperties: false
      required: [text, anxiety, publishAt]
      properties:
        text:
          $ref: '#/components/schemas/WorryText'
        anxiety:
          $ref: '#/components/schemas/Anxiety'
        memo:
          $ref: '#/components/schemas/Memo'
        publishAt:
          type: string
          format: date-time
    AnalysisStatus:
      oneOf:
      - $ref: '#/components/schemas/Pending'
      - $ref: '#/components/schemas/Succeeded'
      - $ref: '#/components/schemas/Failed'
      - $ref: '#/components/schemas/SupportGuidance'
      discriminator:
        propertyName: status
        mapping:
          PENDING: '#/components/schemas/Pending'
          SUCCEEDED: '#/components/schemas/Succeeded'
          FAILED: '#/components/schemas/Failed'
          SUPPORT_GUIDANCE: '#/components/schemas/SupportGuidance'
    Pending:
      type: object
      additionalProperties: false
      required: [requestId, acceptedAt, status]
      properties:
        requestId:
          type: string
          format: uuid
        acceptedAt:
          type: string
          format: date-time
        status:
          type: string
          const: PENDING
    Succeeded:
      type: object
      additionalProperties: false
      required: [requestId, acceptedAt, status, worryId, sealedAt, publishAt]
      properties:
        requestId:
          type: string
          format: uuid
        acceptedAt:
          type: string
          format: date-time
        status:
          type: string
          const: SUCCEEDED
        worryId:
          type: string
          format: uuid
        sealedAt:
          type: string
          format: date-time
        publishAt:
          type: string
          format: date-time
    Failed:
      type: object
      additionalProperties: false
      required: [requestId, acceptedAt, status, failureCode]
      properties:
        requestId:
          type: string
          format: uuid
        acceptedAt:
          type: string
          format: date-time
        status:
          type: string
          const: FAILED
        failureCode:
          type: string
          const: ANALYSIS_FAILED
    SupportGuidance:
      type: object
      additionalProperties: false
      required: [requestId, acceptedAt, status, guidanceCode]
      properties:
        requestId:
          type: string
          format: uuid
        acceptedAt:
          type: string
          format: date-time
        status:
          type: string
          const: SUPPORT_GUIDANCE
        guidanceCode:
          type: string
          const: S16
    VaultSummary:
      type: object
      additionalProperties: false
      required: [lockedCount, publicCount, nearestPublishAt, analysisRequests]
      properties:
        lockedCount:
          type: integer
          minimum: 0
        publicCount:
          type: integer
          minimum: 0
        nearestPublishAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        analysisRequests:
          type: array
          items:
            oneOf:
            - $ref: '#/components/schemas/Pending'
            - $ref: '#/components/schemas/Failed'
    HelpType:
      type: string
      enum: [SHRED, ACTION, REST, EMPATHY]
    GeneratedContent:
      type: object
      additionalProperties: false
      required: [summary, recommendation, actionSteps, restGuide, empathyMessage]
      properties:
        summary:
          type: string
          minLength: 1
          maxLength: 500
        recommendation:
          type: object
          additionalProperties: false
          required: [type, reason]
          properties:
            type:
              $ref: '#/components/schemas/HelpType'
            reason:
              type: string
              minLength: 1
              maxLength: 300
        actionSteps:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 200
          minItems: 3
          maxItems: 3
        restGuide:
          type: string
          minLength: 1
          maxLength: 500
        empathyMessage:
          type: string
          minLength: 1
          maxLength: 500
    LockedWorry:
      type: object
      additionalProperties: false
      required: [worryId, visibility, createdAt, publishAt]
      properties:
        worryId:
          type: string
          format: uuid
        visibility:
          type: string
          const: LOCKED
        createdAt:
          type: string
          format: date-time
        publishAt:
          type: string
          format: date-time
    PublicWorryItem:
      type: object
      additionalProperties: false
      required: [worryId, visibility, createdAt, publishAt, summary, anxietyBefore, firstViewedAt]
      properties:
        worryId:
          type: string
          format: uuid
        visibility:
          type: string
          const: PUBLIC
        createdAt:
          type: string
          format: date-time
        publishAt:
          type: string
          format: date-time
        summary:
          type: string
          minLength: 1
        anxietyBefore:
          $ref: '#/components/schemas/Anxiety'
        firstViewedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
    PublicWorry:
      type: object
      additionalProperties: false
      required: [worryId, visibility, createdAt, publishAt, summary, anxietyBefore, firstViewedAt, text, memo, anxietyAfter,
        analysis]
      properties:
        worryId:
          type: string
          format: uuid
        visibility:
          type: string
          const: PUBLIC
        createdAt:
          type: string
          format: date-time
        publishAt:
          type: string
          format: date-time
        summary:
          type: string
          minLength: 1
        anxietyBefore:
          $ref: '#/components/schemas/Anxiety'
        firstViewedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        text:
          $ref: '#/components/schemas/WorryText'
        memo:
          anyOf:
          - $ref: '#/components/schemas/Memo'
          - type: 'null'
        anxietyAfter:
          anyOf:
          - $ref: '#/components/schemas/Anxiety'
          - type: 'null'
        analysis:
          $ref: '#/components/schemas/GeneratedContent'
    WorryDetail:
      oneOf:
      - $ref: '#/components/schemas/LockedWorry'
      - $ref: '#/components/schemas/PublicWorry'
      discriminator:
        propertyName: visibility
        mapping:
          LOCKED: '#/components/schemas/LockedWorry'
          PUBLIC: '#/components/schemas/PublicWorry'
    WorryList:
      oneOf:
      - $ref: '#/components/schemas/LockedList'
      - $ref: '#/components/schemas/PublicList'
      discriminator:
        propertyName: visibility
        mapping:
          LOCKED: '#/components/schemas/LockedList'
          PUBLIC: '#/components/schemas/PublicList'
    LockedList:
      type: object
      additionalProperties: false
      required: [visibility, items, nextCursor]
      properties:
        visibility:
          type: string
          const: LOCKED
        items:
          type: array
          items:
            $ref: '#/components/schemas/LockedWorry'
        nextCursor:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
    PublicList:
      type: object
      additionalProperties: false
      required: [visibility, items, nextCursor]
      properties:
        visibility:
          type: string
          const: PUBLIC
        items:
          type: array
          items:
            $ref: '#/components/schemas/PublicWorryItem'
        nextCursor:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
    ActivityHelpType:
      type: string
      enum: [ACTION, REST, EMPATHY]
      description: 활동을 만드는 도움 유형. SHRED는 활동이 아니라 삭제다.
    ActivityState:
      type: string
      enum: [IN_PROGRESS, PAUSED, STOPPED, COMPLETED]
      description: PAUSED는 REST에만 있다. 시작 전은 활동이 없다.
    Activity:
      type: object
      additionalProperties: false
      required: [activityId, worryId, helpType, state, startedAt, endedAt, version, serverTime, action, rest, feedback,
        stoppedActivityId, nextUnviewedExists]
      properties:
        activityId:
          type: string
          format: uuid
        worryId:
          type: string
          format: uuid
        helpType:
          $ref: '#/components/schemas/ActivityHelpType'
        state:
          $ref: '#/components/schemas/ActivityState'
        startedAt:
          type: string
          format: date-time
          description: 최초 시작 시각. 재진입·액션 재개에도 바뀌지 않는다.
        endedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: STOPPED·COMPLETED일 때 마지막 중단·완료 시각
        version:
          type: integer
          minimum: 0
          description: 값이 바뀔 때마다 1씩 오른다.
        serverTime:
          type: string
          format: date-time
          description: 응답을 만든 서버 시각. 카운트다운 기준
        action:
          anyOf:
          - $ref: '#/components/schemas/ActionProgress'
          - type: 'null'
          description: ACTION일 때만 값이 있다.
        rest:
          anyOf:
          - $ref: '#/components/schemas/RestTimer'
          - type: 'null'
          description: REST일 때만 값이 있다.
        feedback:
          anyOf:
          - $ref: '#/components/schemas/ActivityFeedback'
          - type: 'null'
          description: 완료된 활동의 도움 평가. 미평가·미완료면 null
        stoppedActivityId:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          description: 시작 요청에서 replaceOpen으로 중단된 활동. 그 외 null
        nextUnviewedExists:
          anyOf:
          - type: boolean
          - type: 'null'
          description: 완료 응답에서만 값이 있다. 아직 열어 보지 않은 다른 공개 걱정이 있는지
    ActionProgress:
      type: object
      additionalProperties: false
      required: [steps, doneCount, canComplete]
      properties:
        steps:
          type: array
          minItems: 3
          maxItems: 3
          items:
            type: object
            additionalProperties: false
            required: [stepNo, done]
            properties:
              stepNo:
                type: integer
                minimum: 1
                maximum: 3
              done:
                type: boolean
        doneCount:
          type: integer
          minimum: 0
          maximum: 3
        canComplete:
          type: boolean
          description: 진행 중이고 세 단계를 모두 체크했으면 true
    RestTimer:
      type: object
      additionalProperties: false
      required: [durationSeconds, endsAt, remainingSeconds, timeOver]
      properties:
        durationSeconds:
          type: integer
          minimum: 1
          description: 휴식 길이. 기본 180초
        endsAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: 진행 중일 때만 값이 있다.
        remainingSeconds:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
          description: 진행 중이면 서버 시각 기준 남은 초(올림), 일시정지면 저장된 남은 초. 중단·완료면 null
        timeOver:
          type: boolean
          description: 진행 중이고 남은 시간이 0이면 true. 서버는 이때도 자동 완료하지 않는다.
    FeedbackAnswer:
      type: string
      enum: [HELPFUL, UNSURE, NOT_HELPFUL]
      description: 도움 됨 / 잘 모르겠음 / 도움 안 됨
    ActivityFeedback:
      type: object
      additionalProperties: false
      required: [answer, answeredAt, updatedAt]
      properties:
        answer:
          $ref: '#/components/schemas/FeedbackAnswer'
        answeredAt:
          type: string
          format: date-time
          description: 최초 응답 시각
        updatedAt:
          type: string
          format: date-time
          description: 마지막으로 답이 바뀐 시각
    SavedFeedback:
      type: object
      additionalProperties: false
      required: [activityId, answer, answeredAt, updatedAt]
      properties:
        activityId:
          type: string
          format: uuid
        answer:
          $ref: '#/components/schemas/FeedbackAnswer'
        answeredAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CurrentActivity:
      type: object
      additionalProperties: false
      required: [activityId, worryId, helpType, state, serverTime, progress]
      properties:
        activityId:
          type: string
          format: uuid
        worryId:
          type: string
          format: uuid
        helpType:
          $ref: '#/components/schemas/ActivityHelpType'
        state:
          type: string
          enum: [IN_PROGRESS, PAUSED]
        serverTime:
          type: string
          format: date-time
        progress:
          description: ACTION은 체크 수, REST는 남은 시간, EMPATHY는 null
          anyOf:
          - type: object
            additionalProperties: false
            required: [doneCount, totalSteps]
            properties:
              doneCount:
                type: integer
                minimum: 0
                maximum: 3
              totalSteps:
                type: integer
                const: 3
          - type: object
            additionalProperties: false
            required: [remainingSeconds, timeOver]
            properties:
              remainingSeconds:
                type: integer
                minimum: 0
              timeOver:
                type: boolean
          - type: 'null'
