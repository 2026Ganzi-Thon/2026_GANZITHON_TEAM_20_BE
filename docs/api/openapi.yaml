                  value:
                    activityId: 5c2d1f0a-7b3e-4c6d-8e9f-0a1b2c3d4e5f
                    worryId: 1c25f56a-0b86-41d3-8f8c-2f7c19e7d842
                    helpType: ACTION
                    state: IN_PROGRESS
                    startedAt: '2026-11-11T23:05:00Z'
                    endedAt: null
