openapi: 3.1.0
info:
  title: NightVault 공개 API
  version: 0.1.0
  description: |-
    공동 검토용 1차 초안. 게스트 인증부터 걱정 접수·봉인·공개와 개별 삭제 경계를 다룬다. 프런트엔드는 같은 출처의 Spring API를 호출한다는 가정이다.
    인증·걱정·상태 응답에는 Cache-Control: no-store를 적용한다. 시간은 RFC 3339 형식이며 서버가 UTC로 반환한다. 15초 지연과 30초 후 화면 이동은 UI 정책이며 API 실패 상태와 독립적이다.
    아이디는 소유권 검사를 대체하지 않는다. 다른 게스트의 대상, 삭제·만료된 대상을 조회하면 404를 반환한다. 공통 오류에는 원문·메모·토큰·AI 응답을 포함하지 않는다. 활동 API(Activity 태그)는 BE2 설계 초안 기준이다. 회고·알림·전체 삭제의 세부 API는 공동 합의 후 확장한다.
servers:
- url: /api/v1
tags:
- name: Guest
- name: Analysis
- name: Vault
- name: Activity
security:
- guestCookie: []
paths:
  /csrf:
    get:
      tags: [Guest]
      operationId: getCsrfToken
      summary: 쓰기 요청에 필요한 CSRF 토큰 조회
      description: 첫 게스트 생성 전에도 호출한다. 브라우저는 응답에서 설정된 JSESSIONID 쿠키를 유지하고, 쓰기 요청에 응답 JSON의 token 값을 X-CSRF-TOKEN 헤더로 전송한다. 게스트 인증 생성·교체 뒤에는 토큰을 다시 조회한다.
      security: []
      responses:
        '200':
          description: CSRF 토큰
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
        '503':
          $ref: '#/components/responses/Unavailable'
  /guest-sessions:
    post:
      tags: [Guest]
      operationId: startGuestSession
      summary: 게스트 금고 시작 또는 다시 시작
      description: START는 쿠키가 없으면 발급하고, 유효하면 기존 세션을 갱신한다. 무효 쿠키의 START는 401이다. RESTART는 무효 쿠키를 새 게스트로 교체한다. 쿠키가 없으면 신규 발급하고,
        유효하면 재사용한다. 이전 금고 데이터는 기존 만료 정책을 따른다.
      security:
      - csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [mode]
              properties:
                mode:
                  type: string
                  enum: [START, RESTART]
            example:
              mode: START
      responses:
        '200':
          description: 유효한 게스트 세션
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestSession'
              examples:
                active:
                  value:
                    authenticated: true
                    expiresAt: '2026-12-11T14:00:00Z'
          headers:
            Set-Cookie:
              description: 발급 또는 갱신된 운영 HTTPS 쿠키. JavaScript에 인증 값을 노출하지 않는다.
              schema:
                type: string
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfRejected'
        '503':
          $ref: '#/components/responses/Unavailable'
  /guest-sessions/current:
    get:
      tags: [Guest]
      operationId: getGuestSession
      summary: 현재 게스트 인증 상태 확인
      description: 유효한 접속으로 인정되면 세션 만료를 갱신한다. 미발급·쿠키 삭제와 전달된 무효 쿠키를 오류 코드로 구분한다.
      responses:
        '200':
          description: 유효한 게스트 세션
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestSession'
              examples:
                active:
                  value:
                    authenticated: true
                    expiresAt: '2026-12-11T14:00:00Z'
          headers:
            Set-Cookie:
              description: 발급 또는 갱신된 운영 HTTPS 쿠키. JavaScript에 인증 값을 노출하지 않는다.
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          $ref: '#/components/responses/Unavailable'
  /worry-publication/default:
    get:
      tags: [Vault]
      operationId: getDefaultPublication
      summary: 다음 기본 공개 일시 조회
      description: 현재보다 엄격히 미래인 첫 현지 기본 시각을 계산한다. 최초 기본값은 현지 08:00이다. 겹치는 시각은 아직 미래인 첫 오프셋을 사용하며, 건너뛴 시각은 그 구간 뒤 첫 유효 시각을
        사용한다.
      parameters:
      - name: timeZone
        in: query
        required: true
        description: IANA 시간대 식별자. 예시 Asia/Seoul.
        schema:
          type: string
          maxLength: 100
      responses:
        '200':
          description: 제안 공개 시각
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultPublication'
              examples:
                seoul:
                  value:
                    publishAt: '2026-11-11T23:00:00Z'
                    timeZone: Asia/Seoul
                    localTime: 08:00
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          $ref: '#/components/responses/Unavailable'
  /vault/summary:
    get:
      tags: [Vault]
      operationId: getVaultSummary
      summary: 홈의 금고 개수와 분석 상태 조회
      description: 걱정의 내용 없이 조회 가능한 잠금·공개 개수와 가장 가까운 잠금 해제 시각을 반환한다. 접수·진행 중인 분석 요청과 최초 접수 후 24시간 이내의 최종 실패를 카드 후보로 반환한다.
        위기 안내 결과는 홈의 복원용 목록에서 제외한다.
      responses:
        '200':
          description: 홈 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VaultSummary'
              examples:
                example:
                  value:
                    lockedCount: 1
                    publicCount: 0
                    nearestPublishAt: '2026-11-11T23:00:00Z'
                    analysisRequests:
                    - requestId: a468359e-5c99-4c60-8cdd-1c5f167a02a3
                      acceptedAt: '2026-11-11T14:00:00Z'
                      status: PENDING
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          $ref: '#/components/responses/Unavailable'
  /worry-requests:
    post:
      tags: [Analysis]
      operationId: submitWorry
      summary: 걱정 분석 접수
      description: 걱정 및 작업 상태를 커밋한 뒤 202와 요청 ID를 반환한다. 같은 게스트와 제출 키로 재전송하면 현재 상태를 200으로 반환한다. 아직 비교용 지문이 있고 내용이 다르면 409다.
        같은 키는 작업을 다시 생성하지 않는다. 사용자가 작성 화면에서 제출을 누를 때만 호출한다. 기존 제출의 재전송 여부는 새 공개 시각 검증 전에 확인한다. 위기 안내는 최초 활성 앱 문맥이 맞을 때만
        반환한다.
      security:
      - guestCookie: []
        csrfToken: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/AnalysisContextRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorryInput'
            example:
              text: 내일 발표 때 첫 문장을 잊어버릴까 걱정돼.
              anxiety: 3
              memo: 발표 첫 문장 확인
              publishAt: '2026-11-11T23:00:00Z'
      responses:
        '200':
          description: 기존 제출의 현재 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisStatus'
              examples:
                pending:
                  value:
                    requestId: a468359e-5c99-4c60-8cdd-1c5f167a02a3
                    acceptedAt: '2026-11-11T14:00:00Z'
                    status: PENDING
                success:
                  value:
                    requestId: a468359e-5c99-4c60-8cdd-1c5f167a02a3
                    acceptedAt: '2026-11-11T14:00:00Z'
                    status: SUCCEEDED
                    worryId: 1c25f56a-0b86-41d3-8f8c-2f7c19e7d842
                    sealedAt: '2026-11-11T14:00:08Z'
                    publishAt: '2026-11-11T23:00:00Z'
                failed:
                  value:
                    requestId: a468359e-5c99-4c60-8cdd-1c5f167a02a3
                    acceptedAt: '2026-11-11T14:00:00Z'
                    status: FAILED
                    failureCode: ANALYSIS_FAILED
                supportGuidance:
                  value:
                    requestId: a468359e-5c99-4c60-8cdd-1c5f167a02a3
                    acceptedAt: '2026-11-11T14:00:00Z'
                    status: SUPPORT_GUIDANCE
                    guidanceCode: S16
        '202':
          description: 새 작업 접수
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pending'
              examples:
                pending:
                  value:
                    requestId: a468359e-5c99-4c60-8cdd-1c5f167a02a3
                    acceptedAt: '2026-11-11T14:00:00Z'
                    status: PENDING
          headers:
            Location:
              description: 공개 API의 요청 상태 조회 URI
              schema:
                type: string
                format: uri-reference
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfRejected'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 같은 제출 키에 다른 입력
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                IDEMPOTENCY_CONFLICT:
                  value:
                    code: IDEMPOTENCY_CONFLICT
                    message: 동일 키가 다른 제출에 사용됐어요.
        '422':
          $ref: '#/components/responses/InvalidPublication'
        '503':
          $ref: '#/components/responses/Unavailable'
  /worry-requests/{requestId}:
    parameters:
    - $ref: '#/components/parameters/RequestId'
    get:
      tags: [Analysis]
      operationId: getWorryRequest
      summary: 접수된 분석 요청 상태 확인
      description: 저장 성공 후 걱정 ID를 반환한다. 분석 원문과 AI 콘텐츠는 이 응답에서 제외한다. 위기 안내에는 같은 활성 앱 문맥의 X-Analysis-Context가 필요하다. 문맥이 유실됐거나
        만료됐으면 404를 반환한다. 성공 응답의 publishAt은 현재 걱정의 공개 시각이다.
      parameters:
      - $ref: '#/components/parameters/AnalysisContext'
      responses:
        '200':
          description: 분석 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisStatus'
              examples:
                pending:
                  value:
                    requestId: a468359e-5c99-4c60-8cdd-1c5f167a02a3
                    acceptedAt: '2026-11-11T14:00:00Z'
                    status: PENDING
                success:
                  value:
                    requestId: a468359e-5c99-4c60-8cdd-1c5f167a02a3
                    acceptedAt: '2026-11-11T14:00:00Z'
                    status: SUCCEEDED
                    worryId: 1c25f56a-0b86-41d3-8f8c-2f7c19e7d842
                    sealedAt: '2026-11-11T14:00:08Z'
                    publishAt: '2026-11-11T23:00:00Z'
                failed:
                  value:
                    requestId: a468359e-5c99-4c60-8cdd-1c5f167a02a3
                    acceptedAt: '2026-11-11T14:00:00Z'
                    status: FAILED
                    failureCode: ANALYSIS_FAILED
                supportGuidance:
                  value:
                    requestId: a468359e-5c99-4c60-8cdd-1c5f167a02a3
                    acceptedAt: '2026-11-11T14:00:00Z'
                    status: SUPPORT_GUIDANCE
                    guidanceCode: S16
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
        '400':
          $ref: '#/components/responses/InvalidInput'
  /worry-requests/{requestId}/retry:
    parameters:
    - $ref: '#/components/parameters/RequestId'
    post:
      tags: [Analysis]
      operationId: retryWorryRequest
      summary: 최종 실패한 걱정 재시도
      description: 최종 실패가 표시되는 동안에만 새 사용자 재시도를 접수한다. 브라우저에 남은 입력 또는 사용자가 다시 입력한 값을 요청에 넣고, publishAt이 지나면 다시 선택한다. 접수 ID와
        최초 보관 기한은 유지한다. 같은 재시도 키의 응답 유실에는 현재 상태를 반환한다. 새 재시도는 활성 앱 문맥을 교체한다. 기존 재시도 키는 새 공개 시각 검증 전에 확인한다. 위기 안내는 저장된 활성
        앱 문맥이 맞을 때만 반환한다.
      security:
      - guestCookie: []
        csrfToken: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/AnalysisContextRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorryInput'
            example:
              text: 내일 발표 때 첫 문장을 잊어버릴까 걱정돼.
              anxiety: 3
              memo: 발표 첫 문장 확인
              publishAt: '2026-11-11T23:00:00Z'
      responses:
        '200':
          description: 이미 접수된 재시도의 현재 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisStatus'
              examples:
                pending:
                  value:
                    requestId: a468359e-5c99-4c60-8cdd-1c5f167a02a3
                    acceptedAt: '2026-11-11T14:00:00Z'
                    status: PENDING
                success:
                  value:
                    requestId: a468359e-5c99-4c60-8cdd-1c5f167a02a3
                    acceptedAt: '2026-11-11T14:00:00Z'
                    status: SUCCEEDED
                    worryId: 1c25f56a-0b86-41d3-8f8c-2f7c19e7d842
                    sealedAt: '2026-11-11T14:00:08Z'
                    publishAt: '2026-11-11T23:00:00Z'
                failed:
                  value:
                    requestId: a468359e-5c99-4c60-8cdd-1c5f167a02a3
                    acceptedAt: '2026-11-11T14:00:00Z'
                    status: FAILED
                    failureCode: ANALYSIS_FAILED
                supportGuidance:
                  value:
                    requestId: a468359e-5c99-4c60-8cdd-1c5f167a02a3
                    acceptedAt: '2026-11-11T14:00:00Z'
                    status: SUPPORT_GUIDANCE
                    guidanceCode: S16
        '202':
          description: 재시도 접수
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pending'
              examples:
                pending:
                  value:
                    requestId: a468359e-5c99-4c60-8cdd-1c5f167a02a3
                    acceptedAt: '2026-11-11T14:00:00Z'
                    status: PENDING
          headers:
            Location:
              description: 공개 API의 요청 상태 조회 URI
              schema:
                type: string
                format: uri-reference
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfRejected'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 새 재시도를 접수할 수 없는 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                RETRY_NOT_ALLOWED:
                  value:
                    code: RETRY_NOT_ALLOWED
                    message: 재시도할 수 있는 상태가 아니에요.
                IDEMPOTENCY_CONFLICT:
                  value:
                    code: IDEMPOTENCY_CONFLICT
                    message: 동일 키가 다른 재시도에 사용됐어요.
        '422':
          $ref: '#/components/responses/InvalidPublication'
        '503':
          $ref: '#/components/responses/Unavailable'
  /worries:
    get:
      tags: [Vault]
      operationId: listWorries
      summary: 잠긴 걱정 또는 공개된 걱정 목록 조회
      description: 잠금과 공개 영역을 따로 조회한다. 작성 최신순이며 같은 작성 시각은 걱정 ID로 정렬한다. cursor는 동일 조회 조건에서만 사용한다. 공개 목록의 요약 노출은 상세 열람을 기록하지
        않는다.
      parameters:
      - name: visibility
        in: query
        required: true
        description: 조회할 영역
        schema:
          type: string
          enum: [LOCKED, PUBLIC]
      - name: cursor
        in: query
        required: false
        description: 앞 응답의 nextCursor
        schema:
          type: string
          minLength: 1
      - name: limit
        in: query
        required: false
        description: 페이지 크기
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: 영역별 걱정 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorryList'
              examples:
                locked:
                  value:
                    visibility: LOCKED
                    items:
                    - worryId: 1c25f56a-0b86-41d3-8f8c-2f7c19e7d842
                      visibility: LOCKED
                      createdAt: '2026-11-11T14:00:00Z'
                      publishAt: '2026-11-11T23:00:00Z'
                    nextCursor: null
                public:
                  value:
                    visibility: PUBLIC
                    items:
                    - worryId: 1c25f56a-0b86-41d3-8f8c-2f7c19e7d842
                      visibility: PUBLIC
                      createdAt: '2026-11-11T14:00:00Z'
                      publishAt: '2026-11-11T23:00:00Z'
                      summary: 내일 발표를 앞두고 내용을 잊을까 걱정하고 있다.
                      anxietyBefore: 3
                      firstViewedAt: null
                    nextCursor: null
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          $ref: '#/components/responses/Unavailable'
  /worries/{worryId}:
    parameters:
    - $ref: '#/components/parameters/WorryId'
    get:
      tags: [Vault]
      operationId: getWorry
      summary: 잠금 안내 또는 공개 상세 조회
      description: 잠긴 응답은 잠금 안내에 필요한 메타데이터만 사용한다. 실제 상세 화면을 열었을 때는 별도의 열람 요청을 호출한다.
      responses:
        '200':
          description: 현재 공개 상태에 맞는 상세
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorryDetail'
              examples:
                locked:
                  value:
                    worryId: 1c25f56a-0b86-41d3-8f8c-2f7c19e7d842
                    visibility: LOCKED
